name: Build & Release Android App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Select outputs to compile (All, AAB, Universal APK, or arm64-v8a APK)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - aab
          - universal-apk
          - arm64-v8a-apk
      build_variant:
        description: 'Build Variant (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      create_release:
        description: 'Create a GitHub Release with compiled files'
        required: false
        default: false
        type: boolean
      tag_name:
        description: 'Tag name for the GitHub release (if create_release is enabled)'
        required: false
        default: 'v1.2.0'
      release_name:
        description: 'Name of the GitHub release'
        required: false
        default: 'Traker v1.2.0 Release'

jobs:
  build:
    name: Compile Android APKs & AAB
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10

      - name: Ensure Environment & Keystore Files
        run: |
          touch .env
          touch .env.example
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Prepare Output Directory
        run: mkdir -p dist-outputs

      - name: Build Android App Bundle (AAB)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_target == 'all' || inputs.build_target == 'aab' }}
        run: |
          if [ "${{ inputs.build_variant }}" = "debug" ]; then
            gradle bundleDebug --no-daemon --no-configuration-cache --stacktrace
            cp app/build/outputs/bundle/debug/*.aab dist-outputs/traker-debug.aab
          else
            gradle bundleRelease --no-daemon --no-configuration-cache --stacktrace
            cp app/build/outputs/bundle/release/*.aab dist-outputs/traker-release.aab
          fi

      - name: Build Universal APK (All ABIs: arm64-v8a, armeabi-v7a, x86, x86_64)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_target == 'all' || inputs.build_target == 'universal-apk' }}
        run: |
          if [ "${{ inputs.build_variant }}" = "debug" ]; then
            gradle assembleDebug --no-daemon --no-configuration-cache --stacktrace
            cp app/build/outputs/apk/debug/*.apk dist-outputs/traker-universal-debug.apk
          else
            gradle assembleRelease --no-daemon --no-configuration-cache --stacktrace
            cp app/build/outputs/apk/release/*.apk dist-outputs/traker-universal-release.apk
          fi

      - name: Build Dedicated arm64-v8a APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_target == 'all' || inputs.build_target == 'arm64-v8a-apk' }}
        run: |
          if [ "${{ inputs.build_variant }}" = "debug" ]; then
            gradle assembleDebug -PabiTarget=arm64-v8a --no-daemon --no-configuration-cache --stacktrace
            cp app/build/outputs/apk/debug/*.apk dist-outputs/traker-arm64-v8a-debug.apk
          else
            gradle assembleRelease -PabiTarget=arm64-v8a --no-daemon --no-configuration-cache --stacktrace
            cp app/build/outputs/apk/release/*.apk dist-outputs/traker-arm64-v8a-release.apk
          fi

      - name: Upload Compiled AAB Artifact
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.build_target == 'all' || inputs.build_target == 'aab') && hashFiles('dist-outputs/*.aab') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: traker-aab-bundle
          path: dist-outputs/*.aab

      - name: Upload Compiled Universal APK Artifact
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.build_target == 'all' || inputs.build_target == 'universal-apk') && hashFiles('dist-outputs/*universal*.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: traker-universal-apk
          path: dist-outputs/*universal*.apk

      - name: Upload Compiled arm64-v8a APK Artifact
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.build_target == 'all' || inputs.build_target == 'arm64-v8a-apk') && hashFiles('dist-outputs/*arm64-v8a*.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: traker-arm64-v8a-apk
          path: dist-outputs/*arm64-v8a*.apk

      - name: Create GitHub Release and Attach Assets (Optional Manual Trigger)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.release_name }}
          draft: false
          prerelease: false
          files: |
            dist-outputs/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
