name: Build & Release Android App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g., v1.0.0)'
        required: false
        default: 'v1.0.0'
      release_name:
        description: 'Name of the release'
        required: false
        default: 'Production Release'

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10

      - name: Ensure Environment Files
        run: |
          touch .env
          touch .env.example

      - name: Clear possibly corrupted bcprov cache (safe)
        run: |
          gradle --stop || true
          # remove only bcprov cache files so other caches remain
          rm -f $HOME/.gradle/caches/jars-9/*bcprov* || true
          rm -rf $HOME/.gradle/caches/modules-2/files-2.1/org.bouncycastle/bcprov-jdk18on/1.79/* || true

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --no-configuration-cache --stacktrace --refresh-dependencies

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --no-configuration-cache --stacktrace --refresh-dependencies

      - name: Build Release Bundle (AAB)
        run: gradle bundleRelease --no-daemon --no-configuration-cache --stacktrace --refresh-dependencies

      - name: Upload Build Artifacts (APKs)
        uses: actions/upload-artifact@v4
        with:
          name: app-apks
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab

      - name: Create Release and Upload Assets (Manual Trigger Only)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: ${{ github.event.inputs.release_name }}
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
