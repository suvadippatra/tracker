name: Manual Android APK & AAB Builder

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Select outputs to compile (All, AAB, Universal APK, or arm64-v8a APK)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - aab
          - universal-apk
          - arm64-v8a-apk
      build_variant:
        description: 'Build Variant (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      create_release:
        description: 'Create a GitHub Release with compiled files'
        required: false
        default: false
        type: boolean
      tag_name:
        description: 'Tag name for the GitHub release (if create_release is enabled)'
        required: false
        default: 'v0.0.1'
        type: string
      release_name:
        description: 'Name of the GitHub release'
        required: false
        default: 'Traker v0.0.1 Release'
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Compile Android APKs and AAB
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'

      - name: Prepare Environment, Keystore, and Dynamic APK Version
        run: |
          touch .env
          touch .env.example
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          mkdir -p dist-outputs

          RAW_TAG="${{ inputs.tag_name }}"
          CLEAN_VER=$(echo "$RAW_TAG" | sed -E 's/^[vV]//' | tr -d '[:space:]')
          if [ -z "$CLEAN_VER" ]; then
            CLEAN_VER="0.0.2"
          fi
          MAJOR=$(echo "$CLEAN_VER" | cut -d. -f1 | grep -E '^[0-9]+$' || echo 0)
          MINOR=$(echo "$CLEAN_VER" | cut -d. -f2 | grep -E '^[0-9]+$' || echo 0)
          PATCH=$(echo "$CLEAN_VER" | cut -d. -f3 | grep -E '^[0-9]+$' || echo 1)
          RUN_NO="${{ github.run_number }}"
          if [ -z "$RUN_NO" ]; then RUN_NO=1; fi
          COMPUTED_CODE=$(( MAJOR * 1000000 + MINOR * 10000 + PATCH * 100 + RUN_NO + 10 ))
          echo "APP_VERSION_NAME=$CLEAN_VER" >> $GITHUB_ENV
          echo "APP_VERSION_CODE=$COMPUTED_CODE" >> $GITHUB_ENV
          echo "Resolved APK versionName=$CLEAN_VER, versionCode=$COMPUTED_CODE"

      - name: Build Android App Bundle (AAB)
        if: ${{ inputs.build_target == 'all' || inputs.build_target == 'aab' }}
        run: |
          if [ "${{ inputs.build_variant }}" = "debug" ]; then
            gradle :app:bundleDebug -PappVersionName="$APP_VERSION_NAME" -PappVersionCode="$APP_VERSION_CODE" -Dksp.useKSP2=true -x lint --max-workers=2 --no-daemon --no-configuration-cache --stacktrace
            find app/build/outputs/bundle/debug -name "*.aab" -exec cp {} dist-outputs/traker-debug.aab \;
          else
            gradle :app:bundleRelease -PappVersionName="$APP_VERSION_NAME" -PappVersionCode="$APP_VERSION_CODE" -Dksp.useKSP2=true -x lint --max-workers=2 --no-daemon --no-configuration-cache --stacktrace
            find app/build/outputs/bundle/release -name "*.aab" -exec cp {} dist-outputs/traker-release.aab \;
          fi

      - name: Build Universal APK (All ABIs)
        if: ${{ inputs.build_target == 'all' || inputs.build_target == 'universal-apk' }}
        run: |
          if [ "${{ inputs.build_variant }}" = "debug" ]; then
            gradle :app:assembleDebug -PappVersionName="$APP_VERSION_NAME" -PappVersionCode="$APP_VERSION_CODE" -Dksp.useKSP2=true -x lint --max-workers=2 --no-daemon --no-configuration-cache --stacktrace
            find app/build/outputs/apk/debug -name "*.apk" -exec cp {} dist-outputs/traker-universal-debug.apk \;
          else
            gradle :app:assembleRelease -PappVersionName="$APP_VERSION_NAME" -PappVersionCode="$APP_VERSION_CODE" -Dksp.useKSP2=true -x lint --max-workers=2 --no-daemon --no-configuration-cache --stacktrace
            find app/build/outputs/apk/release -name "*.apk" -exec cp {} dist-outputs/traker-universal-release.apk \;
          fi

      - name: Build Dedicated arm64-v8a APK
        if: ${{ inputs.build_target == 'all' || inputs.build_target == 'arm64-v8a-apk' }}
        run: |
          if [ "${{ inputs.build_variant }}" = "debug" ]; then
            gradle :app:assembleDebug -PabiTarget=arm64-v8a -PappVersionName="$APP_VERSION_NAME" -PappVersionCode="$APP_VERSION_CODE" -Dksp.useKSP2=true -x lint --max-workers=2 --no-daemon --no-configuration-cache --stacktrace
            find app/build/outputs/apk/debug -name "*.apk" -exec cp {} dist-outputs/traker-arm64-v8a-debug.apk \;
          else
            gradle :app:assembleRelease -PabiTarget=arm64-v8a -PappVersionName="$APP_VERSION_NAME" -PappVersionCode="$APP_VERSION_CODE" -Dksp.useKSP2=true -x lint --max-workers=2 --no-daemon --no-configuration-cache --stacktrace
            find app/build/outputs/apk/release -name "*.apk" -exec cp {} dist-outputs/traker-arm64-v8a-release.apk \;
          fi

      - name: Verify Compiled Outputs
        run: |
          ls -lh dist-outputs/

      - name: Upload Compiled Android Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: traker-android-outputs-${{ inputs.build_target }}-${{ inputs.build_variant }}
          path: dist-outputs/*
          if-no-files-found: error

      - name: Create GitHub Release and Attach Assets
        if: ${{ inputs.create_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.release_name }}
          draft: false
          prerelease: false
          files: |
            dist-outputs/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
